name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HLSL shaders with fxc
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          Write-Host "Using $($fxc.FullName)"
          $out = Join-Path $env:RUNNER_TEMP "cso"
          New-Item -ItemType Directory -Force $out | Out-Null
          $jobs = @(
            @("cs_5_0", "CSFlow",  "shaders\flow.hlsl"),
            @("vs_5_0", "VS",      "shaders\render.hlsl"),
            @("ps_5_0", "PSMid",   "shaders\render.hlsl"),
            @("ps_5_0", "PSAA",    "shaders\render.hlsl"),
            @("ps_5_0", "PSUp",    "shaders\render.hlsl"),
            @("ps_5_0", "PSFinal", "shaders\render.hlsl")
          )
          foreach ($j in $jobs) {
            & $fxc.FullName /nologo /T $j[0] /E $j[1] /Fo (Join-Path $out ($j[1] + ".cso")) $j[2]
            if ($LASTEXITCODE -ne 0) { throw "Shader $($j[1]) failed to compile" }
          }

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path build.log -Pattern 'error' | Select-Object -First 12 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit $code
          }

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test offline executable commands (CPU only)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Superior-offline-smoke"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $frame = Join-Path $dir "frame.pgm"
          "P2`n2 2`n255`n0 0 255 255" | Set-Content -Encoding ascii $frame
          $manifest = Join-Path $dir "manifest.json"
          $report = Join-Path $dir "report.json"
          @{ frames = @(@{ truth="frame.pgm"; generated="frame.pgm"; source_a="frame.pgm"; source_b="frame.pgm" }) } | ConvertTo-Json -Depth 5 | Set-Content $manifest
          $exe = (Resolve-Path build\Release\Superior.exe).Path
          function Invoke-Superior([string[]]$arguments) {
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Offline command timed out" }
            $process.Refresh()
            return $process.ExitCode
          }
          $code = Invoke-Superior @('--verify', ('"' + $manifest + '"'), ('"' + $report + '"'))
          if ($code -ne 0) { throw "Reference verifier failed: $code" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.target_achieved -or $result.frame_count -ne 1) { throw "Unexpected metric fixture report" }
          $inverse = Join-Path $dir "inverse.pgm"
          "P2`n2 2`n255`n255 255 0 0" | Set-Content -Encoding ascii $inverse
          @{ thresholds=@{target_percent=0}; baseline_percent=99; frames=@(@{truth="frame.pgm";generated="inverse.pgm";source_a="frame.pgm";source_b="frame.pgm";content_class="synthetic-metric-fixture"}) } | ConvertTo-Json -Depth 6 | Set-Content $manifest
          $code = Invoke-Superior @('--verify', ('"' + $manifest + '"'), ('"' + $report + '"'))
          if ($code -ne 2) { throw "Baseline regression should exit 2, got $code" }
          $regression = Get-Content $report -Raw | ConvertFrom-Json
          if ($regression.accepted -ne $false -or $regression.baseline_met -ne $false) { throw "Regression incorrectly accepted" }
          $missing = Join-Path $dir "missing.pgm"
          $output = Join-Path $dir "neural.pgm"
          $code = Invoke-Superior @('--neural', ('"' + $missing + '"'), ('"' + $output + '"'), 'missing-model.onnx')
          if ($code -ne 1) { throw "Missing neural input should exit 1, got $code" }
          $failure = Get-Content ($output + '.report.json') -Raw | ConvertFrom-Json
          if ($failure.success -ne $false) { throw "Missing input incorrectly reported success" }
          "Offline CLI smoke tests passed (metric fixture only; no GPU/model inference tested)." | Write-Host

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\Superior.exe dist\
          Copy-Item README.md dist\
          New-Item -ItemType Directory -Force dist\docs | Out-Null
          Copy-Item docs\* dist\docs\ -Recurse
          $hash = (Get-FileHash dist\Superior.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Superior.exe" | Set-Content dist\SHA256SUMS.txt
          Compress-Archive -Path dist\* -DestinationPath Superior-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Superior
          path: |
            dist/Superior.exe
            dist/SHA256SUMS.txt
            Superior-portable.zip
